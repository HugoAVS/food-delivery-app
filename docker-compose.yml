version: '3.8'

services:
  # Eureka Server - Service Discovery
  eureka-server:
    image: hugoand/eureka-service:latest
    container_name: eureka-service
    ports:
      - "8762:8762"
    networks:
      - microservices-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8762/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Restaurant Service
  restaurant-service:
    image: hugoand/restaurant-listing-service:latest
    container_name: restaurant-listing-service
    ports:
      - "9091:9091"
    networks:
      - microservices-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8762/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3308/restaurantdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=1234
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # User Service
  user-service:
    image: hugoand/user-service:latest
    container_name: user-service
    ports:
      - "9092:9092"
    networks:
      - microservices-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8762/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3310/userdb?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=1234
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Food Catalogue Service
  foodcatalogue-service:
    image: hugoand/food-catalogue-service:latest
    container_name: food-catalogue-service
    ports:
      - "9095:9095"
    networks:
      - microservices-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8762/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3307/foodcataloguedb
      - SPRING_DATASOURCE_USERNAME=fooduser
      - SPRING_DATASOURCE_PASSWORD=foodpass
    depends_on:
      eureka-server:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9095/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Order Service
  order-service:
    image: hugoand/order-service:latest
    container_name: order-service
    ports:
      - "9094:9094"
    networks:
      - microservices-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8762/eureka/
      - SPRING_DATA_MONGODB_URI=mongodb+srv://orderuser:123@cluster0.nodgvej.mongodb.net/orderdb?retryWrites=true&w=majority
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9094/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge